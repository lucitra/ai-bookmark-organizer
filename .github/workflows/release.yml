name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    name: Publish immutable release
    if: github.repository == 'lucitra/ai-bookmark-organizer'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          manifest_version="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')).version")"
          test "${RELEASE_TAG}" = "v${manifest_version}"
          git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"

      - name: Build and validate release
        run: scripts/validate-release.sh

      - name: Attest release archives
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/*.zip

      - name: Create release draft with assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          manifest_version="${RELEASE_TAG#v}"
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "AI Bookmark Organizer ${RELEASE_TAG}" \
            "dist/ai-bookmark-organizer-${manifest_version}.zip" \
            "dist/ai-bookmark-organizer.zip" \
            "dist/SHA256SUMS.txt"
          gh release edit "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false \
            --latest
