<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Bookmark Organizer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="header">
        <div class="brand-lockup">
          <img src="icons/icon-32.png" alt="" width="32" height="32" />
          <div>
            <p class="eyebrow">Local Chrome AI</p>
            <h1>Save this page</h1>
          </div>
        </div>
        <span id="aiBadge" class="badge badge-muted">Checking</span>
      </header>

      <section class="capture-card" aria-labelledby="captureTitle">
        <h2 id="captureTitle" class="visually-hidden">Bookmark details</h2>

        <label class="field">
          <span>Title</span>
          <input id="bookmarkTitle" type="text" maxlength="300" autocomplete="off" />
        </label>

        <label class="field">
          <span>URL</span>
          <input id="bookmarkUrl" type="url" readonly />
        </label>

        <div class="field-grid">
          <label class="field">
            <span>Save under</span>
            <select id="destinationFolder"></select>
          </label>

          <label class="field">
            <span>Category</span>
            <input
              id="bookmarkCategory"
              type="text"
              maxlength="60"
              placeholder="Optional folder"
              autocomplete="off"
            />
          </label>
        </div>

        <div class="capture-actions">
          <button id="suggestButton" class="button button-secondary" type="button">
            Suggest category
          </button>
          <button id="saveButton" class="button button-primary" type="button">
            Save bookmark
          </button>
        </div>

        <div class="status-card" aria-live="polite">
          <span id="statusDot" class="status-dot"></span>
          <span id="statusText">Reading the current tab…</span>
        </div>
      </section>

      <a class="workspace-link" href="workspace.html" target="_blank">
        <span>
          <strong>Open Organizer Workspace</strong>
          <small>Organize, resume scans, and ask about bookmarks</small>
        </span>
        <span aria-hidden="true">→</span>
      </a>

      <footer class="footer">
        <span>Titles, URLs, and AI processing stay local.</span>
        <a href="https://github.com/lucitra/ai-bookmark-organizer" target="_blank" rel="noopener noreferrer">
          Source
        </a>
        <a href="https://lucitra.ai/tools/ai-bookmark-organizer/privacy/" target="_blank" rel="noopener noreferrer">
          Privacy
        </a>
      </footer>
    </main>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
