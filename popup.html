<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Bookmark Organizer</title>
    <link rel="stylesheet" href="lucitra.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="tool-bar">
        <nav class="mode-switcher" aria-label="Bookmark tools">
          <span aria-current="page">Save</span>
          <a href="workspace.html#organize" target="_blank">Organize</a>
          <a href="workspace.html#ask" target="_blank">Ask</a>
        </nav>
        <span id="aiBadge" class="tool-ai">Checking AI</span>
      </header>

      <section class="record" aria-labelledby="recordTitle">
        <div class="record-heading">
          <div>
            <p class="overline">Current page</p>
            <h1 id="recordTitle">Save this page</h1>
          </div>
          <span class="context-label luci-mono">active tab</span>
        </div>

        <div class="page-summary">
          <h2 id="activePageTitle">Reading the current page…</h2>
          <span id="activePageHost">Chrome</span>
        </div>

        <dl class="property-list">
          <div class="property-row">
            <dt>Source</dt>
            <dd id="activePageUrl">Reading URL…</dd>
          </div>
          <div class="property-row">
            <dt>Filed to</dt>
            <dd id="filingSummary">Loading…</dd>
          </div>
        </dl>

        <details class="filing-options">
          <summary>
            <span>Filing options</span>
            <span class="luci-mono">Folder + category</span>
          </summary>

          <div class="filing-fields">
            <label class="field">
              <span>Folder</span>
              <select id="destinationFolder"></select>
            </label>

            <label class="field">
              <span>Category</span>
              <input
                id="bookmarkCategory"
                type="text"
                maxlength="60"
                placeholder="Optional subfolder"
                autocomplete="off"
              />
            </label>

            <button id="suggestButton" class="button button-secondary" type="button">
              Suggest a better category
            </button>
          </div>
        </details>
      </section>

      <section class="save-area" aria-label="Save bookmark">
        <button id="saveButton" class="button button-primary" type="button">
          Save bookmark
        </button>
        <div class="status-line" aria-live="polite">
          <span id="statusDot" class="status-dot"></span>
          <span id="statusText">Reading the current tab…</span>
          <span class="shortcut luci-mono">⌘ ↵</span>
        </div>
      </section>

      <footer class="tool-footer">
        <span>Lucitra · Local only</span>
        <a href="settings.html" target="_blank">Settings</a>
        <a href="https://github.com/lucitra/ai-bookmark-organizer" target="_blank" rel="noopener noreferrer">
          Source
        </a>
        <a href="https://lucitra.ai/tools/ai-bookmark-organizer/privacy/" target="_blank" rel="noopener noreferrer">
          Privacy
        </a>
      </footer>
    </main>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
